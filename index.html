<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>圖片轉 3D</title>
<style>
:root{--bg:#14161c;--card:#1d2029;--line:#2c303c;--ink:#eef0f5;--mute:#9aa1b2;--acc:#ffb347;--acc2:#5cc8ff;--bad:#ff6b6b;--ok:#6bdc8c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 0;min-width:0}
button,.btn{appearance:none;border:0;border-radius:12px;padding:13px 10px;font:inherit;font-weight:600;color:var(--ink);background:#2a2f3c;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:disabled,.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.pri{background:var(--acc);color:#1a1205}.blue{background:var(--acc2);color:#04131c}
input[type=file]{display:none}
.seg{display:flex;background:#2a2f3c;border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;min-height:40px;padding:8px 4px;background:transparent;font-weight:600;font-size:14px}.seg button[aria-pressed=true]{background:var(--acc);color:#1a1205}
label.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}label.opt:first-of-type{border-top:0}
label.opt span small{display:block;color:var(--mute);font-size:12px;font-weight:400}
input[type=range]{width:46%;accent-color:var(--acc)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
#thumbs{display:flex;gap:8px}#thumbs figure{flex:1;margin:0;text-align:center;color:var(--mute);font-size:12px}
#thumbs canvas,#thumbs img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:repeating-conic-gradient(#2a2f3c 0 25%,#232733 0 50%) 0 0/16px 16px;display:block}
#view{position:relative;height:min(62vh,520px);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#2b3040,#12141a);touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--mute);font-size:12px;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:20px}
.vbar{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}.vbar button{min-height:40px;width:44px;padding:0;background:rgba(20,22,28,.7);font-size:18px}
.vbar button[aria-pressed=true]{background:var(--acc2);color:#04131c}
#prog{display:none}#prog.on{display:block}
.bar{height:10px;background:#2a2f3c;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ffd27f);transition:width .25s}
#stage{font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}#stage b{color:var(--acc)}
#detail{color:var(--mute);font-size:12px;margin-top:6px;min-height:18px}
.msg{font-size:13px;overflow-wrap:anywhere;border-radius:10px;padding:8px 10px;margin-top:8px;display:none}.msg.on{display:block}.msg.warn{background:#3a2c14;color:#ffd9a0}.msg.err{background:#3a1818;color:#ffb3b3}
#dl{position:fixed;left:0;right:0;bottom:0;background:rgba(20,22,28,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
#dl .row{max-width:720px;margin:0 auto}#dl .btn{font-size:14px;min-height:46px}
.foot{color:var(--mute);font-size:12px}
#jEd{width:100%;display:block;border-radius:10px;touch-action:none;background:repeating-conic-gradient(#2a2f3c 0 25%,#232733 0 50%) 0 0/16px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chips button{flex:0 0 auto;min-height:40px;padding:8px 14px;font-size:14px;border-radius:20px}.chips button[aria-pressed=true]{background:var(--acc2);color:#04131c}.foot a{color:var(--acc2)}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<main>
  <h1>圖片轉 3D</h1>
  <p class="sub">全部在這支手機上運算，不經過任何第三方 API。</p>

  <section class="card">
    <div class="row">
      <label class="btn pri" for="fCam">📷 拍照</label>
      <label class="btn" for="fPick">🖼 選取圖片</label>
    </div>
    <input id="fCam" type="file" accept="image/*" capture="environment">
    <input id="fPick" type="file" accept="image/*">
    <div id="thumbs" style="margin-top:10px">
      <figure><canvas id="tSrc" width="8" height="8"></canvas>原圖</figure>
      <figure><canvas id="tCut" width="8" height="8"></canvas>去背</figure>
      <figure><canvas id="tDep" width="8" height="8"></canvas>深度</figure>
    </div>
  </section>

  <section class="card">
    <div class="seg" role="group" aria-label="輸出類型">
      <button id="m360" aria-pressed="true">360° 立體模型</button>
      <button id="m25" aria-pressed="false">2.5D 深度浮雕</button>
    </div>
    <div style="margin-top:8px">
      <label class="opt"><span>自動去背<small>把主體從背景切出來</small></span><input id="oBg" type="checkbox" checked></label>
      <label class="opt"><span>AI 深度<small>用深度模型讀出遠近；關掉則只依輪廓推估形狀</small></span><input id="oDepth" type="checkbox" checked></label>
      <label class="opt"><span>立體感<small id="vRel">中</small></span><input id="oRel" type="range" min="0" max="100" value="50"></label>
      <label class="opt" id="rowThk"><span>厚度（推估背面）<small id="vThk">中</small></span><input id="oThk" type="range" min="0" max="100" value="55"></label>
      <label class="opt"><span>精細度<small id="vRes">中（約 3 萬面）</small></span><input id="oRes" type="range" min="0" max="2" step="1" value="1"></label>
      <label class="opt"><span>GPU 加速（實驗）<small>手機支援 WebGPU 時較快，但模型下載較大</small></span><input id="oGpu" type="checkbox"></label>
    </div>
    <div class="row" style="margin-top:10px"><button id="go" class="pri" disabled>開始生成</button></div>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card" id="prog" aria-live="polite">
    <div id="stage"><span id="stTxt">準備中</span><b id="stPct">0%</b></div>
    <div class="bar"><i id="stBar"></i></div>
    <div id="detail"></div>
  </section>

  <section class="card" style="padding:0">
    <div id="view">
      <div id="empty">拍照或選一張圖片，<br>按「開始生成」後在這裡預覽</div>
      <div class="vbar">
        <button id="vSpin" aria-pressed="false" title="自動旋轉">⟳</button>
        <button id="vTilt" aria-pressed="false" title="傾斜手機看視差">📱</button>
        <button id="vReset" title="重設視角">⌖</button>
      </div>
      <div id="hint">單指旋轉・雙指縮放／平移</div>
    </div>
  </section>

  <section class="card" id="rigCard" hidden>
    <h2 style="font-size:17px;margin:0 0 8px">綁骨與動作</h2>
    <div class="seg" role="group" aria-label="骨架類型" id="rigType">
      <button data-t="auto" aria-pressed="true">自動</button><button data-t="human" aria-pressed="false">人形</button><button data-t="quad" aria-pressed="false">四足</button><button data-t="obj" aria-pressed="false">物體</button>
    </div>
    <div class="row" style="margin-top:10px"><button id="rFind" class="pri">找關節</button></div>
    <div id="jWrap" hidden style="margin-top:10px">
      <canvas id="jEd"></canvas>
      <div class="sub" id="jTip" style="margin:6px 0 0">拖曳圓點修正關節位置，再按「套用骨架」</div>
      <div class="row" style="margin-top:8px"><button id="rFace" hidden>朝向：右</button><button id="rApply" class="pri">套用骨架</button></div>
    </div>
    <div id="rStat" class="sub" style="margin:8px 0 0"></div>
    <div id="clips" class="chips"></div>
  </section>

  <section class="card foot">
    <div>使用的模型（第一次使用時從 Hugging Face 下載一次，之後存在手機裡、可離線）：</div>
    <div>・去背：briaai/RMBG-1.4（BRIA 授權，限非商業使用）</div>
    <div>・深度：Depth Anything V2 Small（Apache-2.0）</div>
    <div style="margin-top:8px" class="row"><button id="clr">清除已下載的模型</button></div>
    <div id="cacheInfo" style="margin-top:6px"></div>
  </section>
</main>

<nav id="dl">
  <div class="row">
    <a class="btn blue" id="dGlb" aria-disabled="true">⬇ .glb</a>
    <a class="btn" id="dCut" aria-disabled="true">⬇ 去背 PNG</a>
    <a class="btn" id="dDep" aria-disabled="true">⬇ 深度圖</a>
  </div>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const TF_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3';
const $ = id => document.getElementById(id);
const S = { mode: '360', src: null, mask: null, depth: null, glbURL: null, cutURL: null, depURL: null, busy: false };
const RES = [128, 192, 272], RES_T = ['低（約 1 萬面）', '中（約 3 萬面）', '高（約 7 萬面）'];
const lvl = v => v < 25 ? '弱' : v < 45 ? '中弱' : v < 60 ? '中' : v < 80 ? '中強' : '強';

// ---------------- 介面 ----------------
function setMode(m) { S.mode = m; $('m360').setAttribute('aria-pressed', m === '360'); $('m25').setAttribute('aria-pressed', m === '25'); $('rowThk').style.display = m === '360' ? '' : 'none'; if (S.src && S.mask) rebuild(); }
$('m360').onclick = () => setMode('360'); $('m25').onclick = () => setMode('25');
$('oRel').oninput = e => { $('vRel').textContent = lvl(+e.target.value); };
$('oThk').oninput = e => { $('vThk').textContent = lvl(+e.target.value); };
$('oRes').oninput = e => { $('vRes').textContent = RES_T[+e.target.value]; };
['oRel', 'oThk', 'oRes'].forEach(k => $(k).addEventListener('change', () => { if (S.src && S.mask && !S.busy) rebuild(); }));
function why(e) { const t = String(e && e.message || e); return /dynamically imported module|Failed to fetch|NetworkError|Load failed/i.test(t) ? '連不上網路，模型還沒下載過' : /memory|Memory|OOM|allocate/i.test(t) ? '手機記憶體不足，可把精細度調低或關掉其他 App' : t.slice(0, 80); }
function msg(t, kind) { const m = $('msg'); m.className = 'msg' + (t ? ' on ' + (kind || 'warn') : ''); m.textContent = t || ''; }
function prog(txt, pct, det) { $('prog').classList.add('on'); if (txt != null) $('stTxt').textContent = txt; if (pct != null) { $('stPct').textContent = Math.round(pct) + '%'; $('stBar').style.width = pct + '%'; } if (det != null) $('detail').textContent = det; }
const tick = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function setDl(id, url, name) { const a = $(id); if (url) { a.href = url; a.download = name; a.setAttribute('aria-disabled', 'false'); } else { a.removeAttribute('href'); a.setAttribute('aria-disabled', 'true'); } }
function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
function thumb(id, cv) { const t = $(id), k = 256 / Math.max(cv.width, cv.height); t.width = Math.round(cv.width * k); t.height = Math.round(cv.height * k); t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height); }

// ---------------- 讀圖（依 EXIF 轉正，最長邊 1024） ----------------
async function loadFile(f) {
  let bmp;
  try { bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(f); }); }
  const W0 = bmp.width, H0 = bmp.height, k = Math.min(1, 1024 / Math.max(W0, H0)), cv = document.createElement('canvas');
  cv.width = Math.max(8, Math.round(W0 * k)); cv.height = Math.max(8, Math.round(H0 * k)); cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv;
}
async function onFile(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  try { S.src = await loadFile(f); S.mask = S.depth = null; thumb('tSrc', S.src); ['tCut', 'tDep'].forEach(id => { const t = $(id); t.width = t.height = 8; }); $('go').disabled = false; msg(''); prog('圖片已載入，按「開始生成」', 0, `${S.src.width}×${S.src.height}`); }
  catch (err) { msg('這張圖片讀不出來，換一張試試（' + err.message + '）', 'err'); }
}
$('fCam').onchange = onFile; $('fPick').onchange = onFile;

// ---------------- AI 模型（transformers.js，在手機上跑 ONNX） ----------------
let TF = null, RMBG = null, DEPTH = null, DEV = null;
async function tf() { if (!TF) { TF = await import(TF_URL); TF.env.allowLocalModels = false; TF.env.useBrowserCache = true; } return TF; }
async function device() {
  if (DEV) return DEV;
  DEV = { device: 'wasm', dtype: 'q8' };
  if ($('oGpu').checked && navigator.gpu) { try { const ad = await navigator.gpu.requestAdapter(); if (ad) DEV = { device: 'webgpu', dtype: ad.features.has('shader-f16') ? 'fp16' : 'fp32' }; } catch (e) { } }
  return DEV;
}
$('oGpu').onchange = () => { DEV = null; RMBG = DEPTH = null; };
function dlTracker(base, span, label) {
  const files = {};
  return p => {
    if (p.status === 'progress' || p.status === 'initiate' || p.status === 'download') { const f = files[p.file] || (files[p.file] = { l: 0, t: 0 }); if (p.loaded != null) f.l = p.loaded; if (p.total) f.t = p.total; }
    if (p.status === 'done' && files[p.file]) files[p.file].l = files[p.file].t;
    let l = 0, t = 0; for (const k in files) { l += files[k].l; t += files[k].t; }
    if (t > 0) prog(label, base + span * Math.min(1, l / t), `${(l / 1048576).toFixed(1)} / ${(t / 1048576).toFixed(1)} MB${l >= t ? '（已在手機裡）' : ''}`);
  };
}
async function cachedCount() { try { if (!('caches' in window)) return 0; const c = await caches.open('transformers-cache'); return (await c.keys()).length; } catch (e) { return 0; } }
async function aiMask(cv, base, span) {
  const T = await tf(), D = await device();
  if (!RMBG) {
    const cb = dlTracker(base, span * 0.6, '下載去背模型（只需一次）');
    const model = await T.AutoModel.from_pretrained('briaai/RMBG-1.4', { config: { model_type: 'custom' }, device: D.device, dtype: D.dtype, progress_callback: cb });
    const proc = await T.AutoProcessor.from_pretrained('briaai/RMBG-1.4', { config: { do_normalize: true, do_pad: false, do_rescale: true, do_resize: true, image_mean: [0.5, 0.5, 0.5], feature_extractor_type: 'ImageFeatureExtractor', image_std: [1, 1, 1], resample: 2, rescale_factor: 0.00392156862745098, size: { width: 1024, height: 1024 } }, progress_callback: cb });
    RMBG = { model, proc };
  }
  prog('去背運算中…', base + span * 0.65, '手機運算約需 10～40 秒'); await tick();
  const img = await T.RawImage.fromBlob(await new Promise(r => cv.toBlob(r, 'image/png')));
  const { pixel_values } = await RMBG.proc(img);
  const { output } = await RMBG.model({ input: pixel_values });
  const m = await T.RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(cv.width, cv.height);
  const a = new Float32Array(cv.width * cv.height), ch = m.channels || 1;
  for (let i = 0; i < a.length; i++) a[i] = m.data[i * ch] / 255;
  return a;
}
async function aiDepth(cv, base, span) {
  const T = await tf(), D = await device();
  if (!DEPTH) DEPTH = await T.pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small', { device: D.device, dtype: D.dtype, progress_callback: dlTracker(base, span * 0.6, '下載深度模型（只需一次）') });
  prog('深度運算中…', base + span * 0.65, '手機運算約需 5～20 秒'); await tick();
  const img = await T.RawImage.fromBlob(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92)));
  const out = await DEPTH(img);
  let dimg = out.depth; if (dimg.width !== cv.width || dimg.height !== cv.height) dimg = await dimg.resize(cv.width, cv.height);
  const a = new Float32Array(cv.width * cv.height), ch = dimg.channels || 1;
  for (let i = 0; i < a.length; i++) a[i] = dimg.data[i * ch] / 255;   // 越亮越近
  return a;
}

// ---------------- 備用（AI 不能用時）：以邊框顏色判斷背景 ----------------
function keyMask(cv) {
  const W = cv.width, H = cv.height, d = cv.getContext('2d').getImageData(0, 0, W, H).data, n = W * H, bg = [];
  for (let x = 0; x < W; x += 4) bg.push(x, (H - 1) * W + x); for (let y = 0; y < H; y += 4) bg.push(y * W, y * W + W - 1);
  const med = c => { const v = bg.map(i => d[i * 4 + c]).sort((a, b) => a - b); return v[v.length >> 1]; }, br = med(0), bgc = med(1), bb = med(2);
  const dist = i => Math.hypot(d[i * 4] - br, d[i * 4 + 1] - bgc, d[i * 4 + 2] - bb), thr = 38, seen = new Uint8Array(n), q = new Int32Array(n); let h = 0, t = 0;
  const push = i => { if (!seen[i] && dist(i) < thr) { seen[i] = 1; q[t++] = i; } };
  for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); } for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
  while (h < t) { const i = q[h++], x = i % W, y = (i / W) | 0; if (x > 0) push(i - 1); if (x < W - 1) push(i + 1); if (y > 0) push(i - W); if (y < H - 1) push(i + W); }
  const a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = seen[i] ? 0 : 1;
  return blurMask(a, W, H, 2);
}
function blurMask(a, W, H, r) {
  const o = new Float32Array(a.length), t = new Float32Array(a.length);
  for (let y = 0; y < H; y++) { let s = 0; for (let x = -r; x <= r; x++) s += a[y * W + Math.min(W - 1, Math.max(0, x))]; for (let x = 0; x < W; x++) { t[y * W + x] = s / (2 * r + 1); s += a[y * W + Math.min(W - 1, x + r + 1)] - a[y * W + Math.max(0, x - r)]; } }
  for (let x = 0; x < W; x++) { let s = 0; for (let y = -r; y <= r; y++) s += t[Math.min(H - 1, Math.max(0, y)) * W + x]; for (let y = 0; y < H; y++) { o[y * W + x] = s / (2 * r + 1); s += t[Math.min(H - 1, y + r + 1) * W + x] - t[Math.max(0, y - r) * W + x]; } }
  return o;
}

// ---------------- 輸出圖：去背 PNG、深度圖、模型貼圖（背景補色，邊緣不會有白邊） ----------------
function cutCanvas(cv, mask) {
  const W = cv.width, H = cv.height, o = document.createElement('canvas'); o.width = W; o.height = H; const c = o.getContext('2d'); c.drawImage(cv, 0, 0);
  const im = c.getImageData(0, 0, W, H); for (let i = 0; i < W * H; i++) im.data[i * 4 + 3] = Math.round(Math.min(1, Math.max(0, (mask[i] - 0.15) / 0.7)) * 255); c.putImageData(im, 0, 0); return o;
}
function depthCanvas(cv, depth, mask) {
  const W = cv.width, H = cv.height, o = document.createElement('canvas'); o.width = W; o.height = H; const c = o.getContext('2d'), im = c.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const v = Math.round(depth[i] * 255); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = mask ? Math.round(Math.max(0.25, mask[i]) * 255) : 255; }
  c.putImageData(im, 0, 0); return o;
}
function bleedTex(cv, mask) {
